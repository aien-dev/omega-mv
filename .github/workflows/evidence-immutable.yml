name: evidence-immutable

# Reviewed evidence is never rewritten. A pull request may add new files
# under evidence/, but may not modify, rename or delete one that already
# exists on the base branch, except to move it to the evidence shelf
# (tools/modules/evidence_moves.sh). New receipts are content-addressed
# (<name>.<sha256>.json), so a rerun adds a file instead of replacing one.

# Runs on every pull request, not only ones that touch evidence/, so it can be
# a required check: a path-filtered required check never reports on other PRs
# and would block them. The diff below is the only step and takes seconds.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evidence-immutable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse changes to existing evidence files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The one allowed deletion is a move to the evidence shelf (evidence.lock, L396): each moved
          # file is recorded in evidence/SHELF/moved-*.tsv with the bytes it had here. The Spark gate
          # (tests/gates/run.sh evidence-immutable) also proves the shelf commit holds those bytes.
          changed="$(git diff --no-renames --name-status --diff-filter=MRT "$BASE_SHA...$HEAD_SHA" -- evidence/)"
          if ! moved="$(tools/modules/evidence_moves.sh "$BASE_SHA" "$HEAD_SHA")"; then
            changed="$changed${changed:+$'\n'}$(printf '%s\n' "$moved" | grep '^D')"
          fi
          printf '%s\n' "$moved" | tail -1
          if [ -n "$changed" ]; then
            echo "These existing evidence files would be changed:"
            echo "$changed"
            echo "Add a new, content-addressed file instead of rewriting reviewed evidence."
            exit 1
          fi
          echo "evidence/: additions only"
