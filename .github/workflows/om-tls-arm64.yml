# om-tls-arm64: independent ARM64 rerun of the om/tls ECDH unit suite (CAVP KAS ECC CDH, Wycheproof,
# edge cases, mutants), the x509 suite, the om/tls suite (RFC 8448 vectors, DNS unit, DIT probe,
# interop against openssl s_server and the Python fake server, secret-residue scan in default and
# approved-only mode, mutants), the hostile-server suite (hostile.py, local only, with its mutants) and
# of the seed/net HTTP/HTTPS check on a GitHub-hosted ubuntu-24.04-arm machine, with the pinned omc
# (om/units.sh OMC_PIN). Network stages stay NOT_RUN (TLS_NET unset). Logs are uploaded as artifacts.
# Advisory, like AIEN Checks: GitHub gates no merge (Alpha does).
name: om-tls-arm64
on:
  pull_request:
    paths: ["om/tls/**", "seed/net/**", "seed/json/**", "seed/out/omc", "om/units.sh", ".github/workflows/om-tls-arm64.yml"]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  om-tls:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: machine and tools
        run: |
          uname -a; nproc; openssl version; python3 --version
          python3 -c 'import cryptography' 2>/dev/null || sudo apt-get install -y -q python3-cryptography
          python3 -c 'import cryptography; print("cryptography", cryptography.__version__)'
      - name: omc pin
        run: |
          pin=$(sed -n 's/^OMC_PIN=//p' om/units.sh | tr -d '"')
          got=$(sha256sum seed/out/omc | cut -c1-64)
          echo "pin $pin"; echo "got $got"
          [ "$pin" = "$got" ] || { echo "seed/out/omc does not match OMC_PIN"; exit 1; }
          chmod +x seed/out/omc
      - name: om/tls ECDH unit suite
        run: mkdir -p build && sh om/tls/test/ecdh/run.sh "$PWD/seed/out/omc" 2>&1 | tee build/om-tls-ecdh.log; test "${PIPESTATUS[0]}" = 0
      - name: om/tls DRBG unit suite
        run: mkdir -p build && sh om/tls/test/drbg/run.sh "$PWD/seed/out/omc" 2>&1 | tee build/om-tls-drbg.log; test "${PIPESTATUS[0]}" = 0
      - name: om/tls self-test (fips) suite
        run: mkdir -p build && sh om/tls/test/fips/run.sh "$PWD/seed/out/omc" 2>&1 | tee build/om-tls-fips.log; test "${PIPESTATUS[0]}" = 0
      - name: om/tls software integrity suite
        run: mkdir -p build && sh om/tls/test/integrity/run.sh "$PWD/seed/out/omc" 2>&1 | tee build/om-tls-integrity.log; test "${PIPESTATUS[0]}" = 0
      - name: om/tls x509 suite
        run: mkdir -p build && sh om/tls/test/x509/run.sh "$PWD/seed/out/omc" 2>&1 | tee build/om-tls-x509.log; test "${PIPESTATUS[0]}" = 0
      - name: om/tls suite
        run: mkdir -p build && sh om/tls/test/tls/run.sh "$PWD/seed/out/omc" 2>&1 | tee build/om-tls-run.log; test "${PIPESTATUS[0]}" = 0
      - name: om/tls hostile-server suite
        run: mkdir -p build && sh om/tls/test/net/hostile.sh "$PWD/seed/out/omc" 2>&1 | tee build/om-tls-hostile.log; test "${PIPESTATUS[0]}" = 0
      - name: seed/net HTTP and HTTPS check
        run: python3 seed/net/tests/check.py --keep build/netcheck 2>&1 | tee build/net-check.log; test "${PIPESTATUS[0]}" = 0
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: om-tls-arm64-logs
          path: |
            build/om-tls-run.log
            build/om-tls-ecdh.log
            build/om-tls-drbg.log
            build/om-tls-fips.log
            build/om-tls-integrity.log
            build/om-tls-x509.log
            build/om-tls-hostile.log
            build/net-check.log
            build/tls/tls/*.log
            build/tls/tls/interop-table.txt
