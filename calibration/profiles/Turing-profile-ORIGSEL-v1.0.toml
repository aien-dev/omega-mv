# Turing-profile-ORIGSEL-v1.0: the measurement profile for the Turing measurement of the ORIG
# original-specialist experiment (matvec arm chooser; aien-train #24/#25, benchmarks-mv #45,
# omega-mv #731), owned by the Turing instrument issue omega-mv #700.
#
# Definitions 1-3 of "Computing Machinery and Understanding" v1.14 (aien-dev/aienos.com
# c6c6d8bafcfc0b7398dc9337e2f3dd7715e0c814 public/research/computing-machinery-and-understanding/paper.tex,
# sha256 8376faa31bea089b5adb53098e4aa6332e0a685f0d1fa0450f7be828142951f3) are binding.
#
# Format: flat TOML, one `key = value` per line, as calibration/profiles/Turing-profile-v1.1.toml.
# The commitment is Turing-profile-ORIGSEL-v1.0.sha256 = SHA-256 over the exact bytes of this file.
# After the freeze commit this file never changes; any change is a new profile id.

profile_id = "Turing-profile-ORIGSEL-v1.0"
profile_version = "1.0.0"
profile_digest = "SIDECAR"
profile_status = "FROZEN at the commit that adds this file and its sidecar; frozen before the C2 collection exists"
predecessor_profile = "none for this task. The turing_profile block of benchmarks-mv manifests/prereg/orig3_selector.json (v1) and orig3_selector_v2.json (0ca6b9c) is NOT a Definition 3 profile (no quantizer/probability representation fixed, temperature unspecified, no reference coder, no uncertainty procedure, no selection count or test-query history); it reports no Turing number. This profile is the only Turing measurement profile for the ORIG experiment; the ORIG-3 v2 cost verdict (GO/NO-GO) is a separate task-usefulness decision and is not changed by this file."
formula = "T(M;B,D,G,P) = [L(B|G) + L(D|B,G)] - [L(M|G) + L(D|M,G)]"
unit = "Turing (T): one bit of net held-out explanatory compression under this profile"
headline = "specific gain T/n in T per held-out decision, reported with total T, n and the uncertainty envelope; raw totals compared only at the same n"

# ---------------------------------------------------------------- observations D
dataset = "omexp-v1 records of the Omega matvec realization chooser written by the default-off record tap, harness omega-mv 85641e1ea14b1e4a2d2d5790001aacb0bac41093 tests/runtime/rx_empirical_optimizer.c (binary sha256 37f4c229293d148313d6972898f9f4e8237775a8505bc1e53c20eb8ebf681339), collection C2 exactly as benchmarks-mv docs/orig3/PROTOCOL-v2.md section 2 (0ca6b9c): OMEGA_EMPIRICAL_COVERAGE=600, EMPIRICAL_ALLOW_NO_WIN=1, nice -n 19, one run."
admission = "aien-train native/si19/omexp.om oxadm2 at a15042d8a7f5009e93e7943f01694377392de88f (docs/si19/ORIG1-CONTRACT-v2.md): per-record refusals with counted reasons; whole-file refusal ends the measurement BLOCKED."
data_split = "Workload family (floor log2 M, floor log2 N), frozen split table aien-train docs/si19/orig1-v2-splits.txt sha256 c072d49843ecb5162fa03323790254cd96c96b9138461c80562d6051ed84f4cb (168 families: 100 TRAIN / 32 VALIDATION / 36 HELD-OUT). TRAIN: arm fitting. VALIDATION pressure 0: early stopping (ORIG-2 trainer) and every probability table of this profile. D = HELD-OUT, pressure bucket 0, core classes 0 and 1, every admitted record, none dropped. HELD-OUT pressure 1 is a second, separately reported regime (out-of-distribution pressure), never pooled into D."
observation = "x_t in {0,1,2,3,4}: the measured oracle arm of held-out decision t = the cheapest admissible arm by ps per call, lowest index on a tie (omexp.om oxbest). oxadm2 admits only records whose admissible set is exactly arms 0..4 (mask 31), so K = 5 for every t."
alphabet_size_K = 5
quantizer = "None needed: x_t is already a discrete symbol (A3 is satisfied by the argmin; measured costs are not coded)."
sequence_ordering = "Ascending record sequence word (word 14) of the C2 file, i.e. tap order."
episode_boundaries = "Every decision is its own episode; no predictive context crosses records."
reset_warmstart = "Frozen models only; no state carries between records; p(x_t | x_<t, s_t, G) = p(x_t | s_t, G)."
initial_context = "The state words 2..13 of record t (core class, pressure, M, N, calls, cache/state bytes, mask, arm count); measured costs, verified flags, sequence, thermal and time words are never inputs."

# ---------------------------------------------------------------- probability representation (shared by every arm)
probability_representation = "Rank calibration R1. Each arm X maps a state s to a total order sigma_X(s) of arms 0..4 (its own score order, ties to the lower index). p_X(x = a | s) = q_X[c][rank of a in sigma_X(s)] / 65536, where c = 0 for arms without context and c = kappa(s) for context arms, and q_X[c] is a 5-entry 16-bit row fitted on VALIDATION pressure-0 records by rule F1."
fit_rule_F1 = "Counts n_r = number of fit records whose oracle arm has rank r under sigma_X (per context c), N = sum n_r. Entries q_r = 1 + floor(65531 * (2 n_r + 1) / (2 N + 5)); the remainder 65536 - sum q_r is added to the entry with the largest n_r (lowest r on a tie). Every entry >= 1, rows sum to exactly 65536 (the TPS1 rule)."
uniform_row = "q = (13108, 13107, 13107, 13107, 13107)."
codelength_method = "Both kinds. T_ideal: L(D|X,G) = sum_t ub(q_X[x_t]) micro-bits, ub = the exact integer rule of calibration/docs/CODER_SPEC.md section 8 (ty_ubits_q16); bits = ub / 10^6. T_real: L_real(D|X,G) = 8 x every byte of the coded file (header and flush included) of the declared reference coder on (TPS1, TSY1) of arm X."
reference_coder = "rANS TCA1 (primary) and range TCR1 (second), turing-coder (src/turing/tc_tool.c, CODER_SPEC.md) at omega-mv a647b6a9821fffcf52ba9ce813f75afa4b84be62; one TPS1 and one TSY1 file per arm over D in sequence_ordering; profile_digest field = this profile's sidecar digest, model_digest = SHA-256('turing.origsel.arm.v1' || 0x00 || arm id || 0x00 || model artifact bytes), dataset_digest = SHA-256 of the C2 file."
h1_bridge = "H1 holds for an arm and a coder only if decode(encode) reproduces TSY1 byte for byte (turing-coder verify) and the overhead delta = coded bits - ideal bits satisfies |delta - 448| <= 96 + ceil(n/64) (448 = the 56-byte header). T_real is reported only for coders where H1 holds for B and M; then T_real - T_ideal = delta_B - delta_M exactly (model costs identical in both). Otherwise only T_ideal is reported and no compression claim is made."

# ---------------------------------------------------------------- arms (selection_count = 10, all enumerated here before C2 exists)
baseline = "B = FR, the incumbent fixed rule (omexp.om oxrule: arm 2 when N <= 8 else arm 3): sigma_FR = (rule arm, then the other arms ascending). Frozen now; its only learned part is its R1 row."
baseline_sensitivity = "U uniform (no fit); O0 order-0 = constant score, sigma = (0,1,2,3,4), equivalently the frequency of the oracle arm; S best static (omexp.om oxstatic per core class: sigma = arms ascending by total TRAIN ps of that core class, ties lower index). T(M; X, D) is reported for X in {U, O0, S} beside T(M; FR, D)."
candidates = "M1 learned guidance: the ORIG-2 scratch MLP v2 (select.om kind 2, 20-32-1 ReLU, 705 params, seed 19024 random init, lr 2^-8, <= 64 epochs, patience 16, best-on-VALIDATION params, trained on C2 TRAIN by tests/si19/run-select.sh V2=1 at aien-train 692d85104369cf0fc0bec9f35c4ca693cf746012 exactly as PROTOCOL-v2 section 3), sigma = ascending slfwd score with the best-on-VALIDATION params. M2 guidance plus bounded reusable .om abstraction: M1's sigma with a context-conditioned R1 row per kappa(s). A abstraction alone: sigma = (0,1,2,3,4) with an R1 row per kappa(s) (an order-0 table per context)."
abstraction_kappa = "kappa(s) = 2 x core class + (1 if N <= 8 else 0), 4 contexts; source native/turing/origsel_kappa.om in this commit, charged by its byte length."
controls = "R retrieval = memorizer control: the nearest TRAIN record (omexp.om oxnear v2: same core class and pressure, L1 on lg16 M, lg16 N, lowest index tie); sigma = that record's arms ascending by its measured ps (ties lower index). C_sh shuffled-label MLP and C_un untrained MLP from the same V2=1 run (controls 1 and 2 of the trainer), scored exactly like M1."
selection_count = 10
test_query_history = "C2 does not exist at this freeze. Its HELD-OUT outcomes are read once, after the C2 images exist, by (a) the ORIG-3 v2 cost judge (benchmarks-mv 0ca6b9c) and (b) this profile's evaluator; neither feeds back into any arm (no retraining, no table refit after HELD-OUT is read). The v1 owner file and v1 SEALED-FINAL file are never part of D (their workloads were already inspected)."

# ---------------------------------------------------------------- model cost L(X|G)
model_code = "Quantized two-part code, precision = the precision the arm actually computes with. Primary code P1 (marginal): L = bits of every number the arm adds beyond G. Sensitivity code P2 (with code): P1 plus 8 x the byte length of every program source the arm needs that is not in the frozen instrument (so the select.om forward pass counts for M1, M2, C_sh, C_un; oxrule/oxstatic/oxnear source for FR, S, R)."
candidate_encoding = "R1 row = 4 x 16 = 64 bits (fifth entry implied by the sum). U: 0. O0, FR: 64. S: 64 + 3 x 7 (one of 120 orders per core class). R: 64 + 26 x (admitted TRAIN records): core 2, pressure 1, lg16 M 8, lg16 N 8, stored order 7 bits each. M1, C_sh, C_un: 64 + 32 (kind, H) + 705 x 32 (binary32 best-on-VALIDATION params; normalization does not change a score order and is not needed). M2: M1 - 64 + 4 x 64 + 8 x bytes(origsel_kappa.om). A: 4 x 64 + 8 x bytes(origsel_kappa.om)."
shared_background = "G (declared, versioned, not charged in P1): omega-mv seed compiler omc sha256 734f0a39319fbfa930bcc62cb30dbf06d47d78e126372b74f5baf478e6126b61 (and R5b 191b776ef98821597c3e30655da6d680a9b66edbc9ceaca3c39c61ea6df098e9); omega-bridge 7e1d0d61 add32/mul32; omega-mv 3a995ba8 metadata.om; aien-train c7642d96 affine.om; aien-train a15042d8 omexp.om (reader, features, oxrule, oxstatic, oxnear, splits); aien-train 692d8510 select.om and selmain.om (trainer and forward pass) and run-select.sh; aien-architecture a211260c tools/zero-legacy/sha256.om; omega-mv a647b6a9 turing-coder; harness 85641e1e; split table c072d498. Prior artifacts in the causal chain: the v1 ORIG-2 design and hyperparameters, chosen after inspecting the v1 owner file (disclosed; that file is not D); the authoring agents (omp sessions on anthropic/claude-opus-5-5 and openai-codex models) wrote the code and saw no C2 data. No pretrained model, weight, teacher output or corpus enters any arm. Amortized background cost is reported as source byte counts under P2."
overlap_audit = "No pretrained data exists in any arm. Workload overlap: the evaluator refuses D if any HELD-OUT (core, pressure, M, N) key equals a key of the v1 owner file, the v1 SEALED-FINAL file or C2 TRAIN/VALIDATION (oxadm2 and a cross-file key check)."

# ---------------------------------------------------------------- sealing, blinding, verification
seal_commitment = "Future-data exception (paper section 5.2): the collection protocol (harness commit 85641e1e, binary sha256 37f4c229..., command, admission and split pins above) is committed by this freeze; the realized C2 file is hashed (sha256 and FNV-1a 64) when collected and recorded before any HELD-OUT outcome is read."
blinding_mechanism = "(1) Temporal: C2 is collected after this freeze commit and the ORIG v2 prereg are pushed (GitHub push times are the third-party record). (2) Program-enforced non-access audit, rerunnable by anyone with C2: the evaluator rebuilds C2' with every HELD-OUT cost word multiplied by 3 and the oracle labels permuted, reruns the pinned V2=1 trainer on C2', and requires the candidate and control images to be byte-identical to those trained on C2, and every TPS1 file of every arm to be byte-identical (outcomes of D cannot reach any prediction). Status: organisationally UNISOLATED (one operator fleet runs collection, training and evaluation); this status is stated on every receipt."
uncertainty_envelope = "Block bootstrap over held-out blocks, block = (core class, workload family); B = 10000 replicates; RNG splitmix64 seeded 20261025, one draw per block pick, index = draw mod nblocks; replicate statistic = sum over picked blocks of the per-decision ub differences (B arm minus X arm) minus 10^6 x (L(X|G) - L(B|G)); lower bound lb5 = replicate of rank 500 (1-based, ascending), upper bound ub95 = rank 9501. Model costs are exact (no uncertainty). Paired bootstrap for Delta T(M2 vs M1) = DL(M1) - DL(M2), which does not depend on B."
evaluation_procedure = "1 admit C2 (oxadm2, split disjointness, cross-file key check). 2 obtain the V2=1 images (mlp, shuffled, untrained) and their run receipt; verify sha256. 3 non-access audit (blinding_mechanism 2). 4 fit every R1 row on VALIDATION pressure 0. 5 write TPS1/TSY1 per arm over D. 6 .om evaluator computes per-decision ub, L(D|X,G), L(X|G) P1 and P2, T_ideal and T/n for every arm against FR, U, O0, S, the bootstrap, Delta T(M2 vs M1). 7 independent recomputation: turing-coder verify (rans and range) per arm reproduces ideal_ub exactly and gives coded bits; a second-language recomputation of totals and bootstrap from the per-decision ub list must agree exactly. 8 verdict rule below, applied verbatim."
verification_requirements = "Instrument qualification before any HELD-OUT outcome is read: ub golden vectors of CODER_SPEC section 8; .om ideal_ub equals turing-coder ideal_ub on fixture streams; refusal of a receipt with a wrong L(X|G), an undeclared background unit (hash not pinned), duplicate or unpaired records, a mutated receipt field; leakage test (perturbing D outcomes must not change any TPS1); planted-structure fixture gives T > 0, null fixture gives T <= 0 within the envelope. Each failure blocks the measurement (BLOCKED_INSTRUMENT)."
verdict_rule = "Per candidate M in {M1, M2, A}: QUALIFIED_IMPROVEMENT iff T_ideal(M;FR) > 0 and lb5(M;FR) > 0 and lb5(M;X) > 0 for every X in {U, O0, S} (H2 with baseline sensitivity); NO_IMPROVEMENT iff ub95(M;FR) <= 0; else INCONCLUSIVE. Experiment: QUALIFIED_IMPROVEMENT if any candidate qualifies (always qualified by UNISOLATED), NO_IMPROVEMENT if every candidate is NO_IMPROVEMENT, INVALID if a null control has lb5 > 0 of its predictive-only gain over O0 (C_sh, C_un) or the non-access audit fails, BLOCKED if C2 is missing, collected before this freeze was pushed, refused, or the instrument fails qualification; else INCONCLUSIVE. 'Actual compression' is claimed only where H1 holds (T_real); otherwise results are T_ideal."
futility_disclosure = "Declared before data: M1, M2, C_sh and C_un each pay about 22,600 bits in P1 while a decision can save at most log2 5 = 2.32 bits against any baseline, so they cannot reach T > 0 below n of about 9,800 decisions; C2 HELD-OUT pressure 0 is expected near 300 decisions. Their expected verdict is NO_IMPROVEMENT regardless of decision quality. This is the measured price of the 705-parameter binary32 model on this experience volume, not a defect of the instrument."
not_measured = "energy_instrumentation = none, attribution_rule = none; Turing yield and T/J are NOT_MEASURED and not reported. GB10 NOT_RUN (host-only measurement)."
energy_instrumentation = "none (NOT_MEASURED)"
attribution_rule = "none: no joules are attributed; informational conservation: each candidate receives one gain under this profile, never split or re-credited across ORIG issues."
software_version = "see shared_background; evaluator native/turing/origsel*.om at the evaluation commit, recorded in every receipt with its sha256 and the omc sha256."
separate_measures = "Reported beside T, never inside it: task correctness (verified-arm legality, from admission), transfer (HELD-OUT pressure 1 regime; HELD-OUT families are unseen by construction), retention after restart (TPS1 bytes identical after reloading every image in a fresh process), decision-cost regressions, learning cost and per-decision overhead (ORIG-3 v2 judge and overhead campaign, cited by commit, not recomputed)."
