# Turing-profile-ORIGSEL-v1.1: the measurement profile for the Turing measurement of the ORIG
# original-specialist experiment (matvec arm chooser; aien-train #24/#25, benchmarks-mv #45,
# omega-mv #731), owned by the Turing instrument issue omega-mv #700.
#
# Definitions 1-3 of "Computing Machinery and Understanding" v1.14 (aien-dev/aienos.com
# c6c6d8bafcfc0b7398dc9337e2f3dd7715e0c814 public/research/computing-machinery-and-understanding/paper.tex,
# sha256 8376faa31bea089b5adb53098e4aa6332e0a685f0d1fa0450f7be828142951f3) are binding.
#
# Format: flat TOML, one `key = value` per line, as calibration/profiles/Turing-profile-v1.1.toml.
# Commitment: Turing-profile-ORIGSEL-v1.1.sha256 = SHA-256 over the exact bytes of this file.
# After the freeze commit this file never changes; any change is a new profile id.

profile_id = "Turing-profile-ORIGSEL-v1.1"
profile_version = "1.1.0"
profile_digest = "SIDECAR"
profile_status = "FROZEN at the commit that adds this file and its sidecar; frozen before any collection that can supply D exists"
predecessor_profile = "Turing-profile-ORIGSEL-v1.0 (omega-mv cdd2f55e, sidecar 5aee9f20...be00), superseded before any data existed and never used. Defects found by two independent read-only reviews (2026-10-25, before collection): the non-access audit compared bytes that depend on the dataset hash by construction (image bytes 104..111 and trailer, TPS1 dataset digest) and C2' was refused by the allow-list; the evaluator was not frozen before D's labels become visible (the ORIG v2 run-select.sh V2=1 prints HELD-OUT per-record lines); the overlap audit refused instead of excluding re-measured v1 workloads; G left arm-specific constants free for some arms and charged others by source bytes; the null-control INVALID rule was not a null test; bootstrap, verdict precedence, H1 net-gain bound and recomputation inputs were underspecified; the futility bound was misstated. The turing_profile blocks of benchmarks-mv orig3_selector.json and orig3_selector_v2.json are not Definition 3 profiles and report no Turing number."
formula = "T(M;B,D,G,P) = [L(B|G) + L(D|B,G)] - [L(M|G) + L(D|M,G)]; every codelength is also conditional on the uncoded, outcome-free state stream S that every decoder receives identically."
unit = "Turing (T): one bit of net held-out explanatory compression under this profile"
headline = "specific gain T/n in T per held-out decision, with total T, n, F (blocks) and the uncertainty envelope; raw totals compared only at the same n"

# ---------------------------------------------------------------- freeze order and stopping rule
evaluator_freeze = "Commit E on omega-mv branch feat/700-turing-origsel contains the .om evaluator (native/turing/origsel.om, origselmain.om, origsel_kappa.om), the independent recomputer, all glue, the pin file, their sha256, the omc sha256, and the instrument qualification receipts on fixtures and on the v1 owner file. E is pushed before the collection that supplies D starts. Nothing in E changes after that collection exists; every later step is a fixed program of the collected file with no free choice."
d_collection_rule = "D comes from the first collection started after E is pushed (GitHub push time). If that is ORIG v2's C2 (benchmarks-mv docs/orig3/PROTOCOL-v2.md s.2, harness omega-mv 85641e1e binary sha256 37f4c229..., OMEGA_EMPIRICAL_COVERAGE=600), D is drawn from C2. If C2 started before E was pushed, C2 is not D: D is then drawn from C3, one run of the same harness plus a default-off OMEGA_EMPIRICAL_COVERAGE_SEED (coverage seed base, default 9000) pinned in E, with OMEGA_EMPIRICAL_COVERAGE=640, nice -n 19, EMPIRICAL_ALLOW_NO_WIN=1, coverage seed base = the first 8 hex digits of E's commit id read as an integer, plus 100000 (so no shape list exists before E)."
stopping_rule = "One collection, one training run per MLP arm, one evaluation. After the collection exists any BLOCKED or audit failure is terminal for this profile; a retry needs a new profile id and a new collection. The receipt is committed whatever the verdict."
seal_commitment = "Future-data exception (paper s.5.2): the collection protocol is committed by this freeze and by E; the realized file's sha256 and FNV-1a 64 are posted (omega-mv #700 and benchmarks-mv #45) before any program of this profile opens it."
test_query_history = "HELD-OUT outcomes of C2 (if C2 is D) are read by ORIG v2 (run-select.sh V2=1 mode T flags 14 and mode E per-record lines, the ORIG-3 v2 judge, the ORIG-4 overhead campaign), then by E. None of them can change any arm of this profile: every arm component is a fixed function of TRAIN and VALIDATION computed by E. If D is C3, it is read only by E. The v1 owner file (fnv 16622604375676129865) and v1 SEALED-FINAL (fnv 12602815733741495377) were inspected earlier and never enter D."

# ---------------------------------------------------------------- observations D
dataset = "omexp-v1 records of the Omega matvec realization chooser written by the default-off record tap of the harness named in d_collection_rule."
admission = "aien-train native/si19/omexp.om oxadm2 at 692d85104369cf0fc0bec9f35c4ca693cf746012 (ORIG1-CONTRACT-v2.md); the allow-list line of the collected file is the operator's AUTHORIZED line. Whole-file refusal: BLOCKED."
data_split = "Workload family (floor log2 M, floor log2 N); frozen split table aien-train docs/si19/orig1-v2-splits.txt sha256 c072d49843ecb5162fa03323790254cd96c96b9138461c80562d6051ed84f4cb (100 TRAIN / 32 VALIDATION / 36 HELD-OUT). MLP training uses TRAIN (both pressures) and early stopping on VALIDATION (both pressures), exactly the pinned trainer. Every R1 count of this profile uses VALIDATION pressure-0 records only."
burned_exclusion = "Excluded from D, counted, never consulted for outcomes: any admitted HELD-OUT record whose (M, N) occurs in the v1 owner file or v1 SEALED-FINAL (both the v1 files above), under any core class or pressure. The evaluator reads the v1 files' M and N words only."
d_definition = "D = admitted HELD-OUT records with pressure bucket 0 and core class 0 or 1 after burned_exclusion, every one of them, in ascending record sequence word (word 14). D_v1fam = the records of D in families that hold any v1 record; D_fresh = the rest. Both are reported as sensitivity beside D. HELD-OUT pressure 1 (same exclusion) is a separate regime R_p1, reported, never pooled."
observation = "x_t in {0,1,2,3,4}: the oracle arm of decision t = cheapest admissible arm by ps per call, lowest index on a tie (omexp.om oxbest). oxadm2 admits only records whose admissible set is exactly arms 0..4, so K = 5."
alphabet_size_K = 5
quantizer = "None needed: x_t is already a discrete symbol; measured costs are never coded."
sequence_ordering = "Ascending word 14 of the collected file."
episode_boundaries = "Each decision is its own episode; no predictive context crosses records."
reset_warmstart = "Frozen arms only; p(x_t | x_<t, S, G) = p(x_t | s_t, G)."
initial_context = "s_t = words 3, 4, 5, 6, 9, 10 of record t (core class, pressure, M, N, state bytes, cache bytes), the inputs of oxfeat. No other word reaches any arm."

# ---------------------------------------------------------------- probability representation
probability_representation = "Rank calibration R1, identical for every arm. Arm X maps s_t to a total order sigma_X(s_t) of arms 0..4 (its scores ascending; equal scores go to the lower arm index; binary32 scores compare in select.om slkey order, -0 = +0). With context c = cx_X(s_t) (0 when the arm has no context map), q_t[a] = Q_X[c][rank of a in sigma_X(s_t)]. U has no row: q = (13108, 13107, 13107, 13107, 13107)."
fit_rule_F1 = "n_r = VALIDATION pressure-0 records (core 0 or 1) of context c whose oracle arm has rank r under sigma_X, N = sum n_r. Q_r = 1 + floor(65531 (2 n_r + 1) / (2 N + 5)); the remainder 65536 - sum Q_r goes to the entry with the largest n_r (lowest r on a tie). N = 0 gives the uniform-like row of the same rule."
tps1_mapping = "One TPS1 and one TSY1 per arm over D: observation_index = t, context_key = word 14, crumb ordinal = the record's block index (uncertainty_envelope), norm_sum 65536, q[a] as above; header profile_digest = this file's sidecar digest, model_digest = SHA-256('turing.origsel.arm.v1' || 0x00 || model code bytes), dataset_digest = SHA-256 of the collected file. Digests and trailers are computed by the glue with coreutils sha256sum (disclosed external tool) and checked by turing-coder's parser."
codelength_method = "Both kinds. T_ideal: L(D|X,G) = sum_t ub(q_t[x_t]) micro-bits, ub = the integer rule of calibration/docs/CODER_SPEC.md s.8 (ty_ubits_q16); bits = ub / 10^6; arithmetic error at most 0.501 micro-bit per symbol per arm. T_real: 8 x every byte of the coded file of the reference coder."
reference_coder = "turing-coder (src/turing/tc_tool.c) at omega-mv a647b6a9821fffcf52ba9ce813f75afa4b84be62: rANS TCA1 is the primary coder; range TCR1 is reported second and never substitutes for a failed rANS."
h1_bridge = "H1 holds for (Y, M, coder) iff both round trips are byte-exact (turing-coder verify), each arm's delta = coded bits - ideal bits has |delta - 448| <= 64 + ceil(n/64), and |delta_Y - delta_M| <= 2 (64 + ceil(n/64)). The band is qualified in E on K = 5 fixture streams at n in {50, 100, 300}; a range-coder band failure removes only the range T_real. T_real = T_ideal + (delta_Y - delta_M); 'actual compression' is claimed only where H1 holds and lb(T_ideal) + (delta_Y - delta_M) > 0."

# ---------------------------------------------------------------- shared background and model code
shared_background = "G = parameter-free decoders used identically by every arm or by the evaluator only: omc sha256 734f0a39319fbfa930bcc62cb30dbf06d47d78e126372b74f5baf478e6126b61; omega-bridge 7e1d0d61 native/ref32/add32.om, mul32.om; omega 3a995ba8 native/ecosystem663/metadata.om; aien-train c7642d96 native/ecosystem6/affine.om; aien-train 692d8510 native/si19/fixture.om, world.om (wmbits, wsabs, wsenc), omexp.om (reader, oxadm2, oxhspl, oxfeat, oxbest), omexpfix.om, select.om (the MLP 20-H-1 binary32 forward pass slfwd and the image reader sladmit), all at the sha256 of native/orig4/orig4.pin at omega-mv 85641e1e; the R1 map, F1, ub, TPS1/TSY1, both coders; the generic evaluators TG1 (threshold-test map), nearest neighbour by L1 over a stored table, order by stored permutation index. No pretrained model, weight, teacher output or corpus is in G or in any arm."
causal_chain_disclosure = "Not decoder inputs, declared per paper s.5.7: the trainer (select.om sltrain, run-select.sh V2=1 at 692d8510); the v1 design and hyperparameters (2 kinds x 3 learning rates chosen on v1 DEV); the v1 owner and SEALED-FINAL files, which were inspected before this design and hold shapes inside v2 HELD-OUT families (so HELD-OUT families are unseen by every fitted parameter, not by the design); the authoring agents (omp sessions on anthropic/claude-opus-5-5 and openai-codex models), which saw no file that can be D."
model_code = "P1 (primary, the verdict code): the bit length of the arm's canonical model code below, decodable with G alone; every scored predictor is the one decoded from its code. P2 (sensitivity, never the verdict): P1 + 8 x canonical bytes (note lines and blank lines removed) of each G evaluator unit the arm uses beyond the reader (MLP arms: select.om; R: oxnear and oxl1; S: oxstatic; FR and context arms: origsel_kappa.om or oxrule). Amortized background: the byte counts of every G unit are reported with the denominator 10 arms."
row_code = "An R1 row is coded by its F1 counts: gamma(N + 1) + ceil(log2 C(N + 4, 4)) bits (Elias gamma; enumerative code of the 5 counts summing to N); the decoder reruns F1."
tg1_code = "A threshold-test map: gamma(k + 1) for k tests; per test 3 bits for the word (3, 4, 5, 6, 9, 10), 1 bit for the relation (<= or =), gamma(v + 1) for the constant v; per leaf that names an arm ceil(log2 5) = 3 bits."
candidate_encoding = "U: 0. O0: one row. FR: TG1 of the incumbent (one test word 6 <= 8, leaves arm 2 and arm 3) + one row. S: two order indices of 7 bits (0..119, lexicographic permutation enumeration) + one row. R: 12-bit record count + per admitted TRAIN record core 2 bits, pressure 1 bit, lg16 M 8, lg16 N 8, stored order 7 bits, in TRAIN tap order + one row; no neighbour gives sigma = (0,1,2,3,4). M1, C_sh, C_un: 32 metadata bits (kind 8, H 8, nparams 16) + 705 x 32 (the best-on-VALIDATION SB binary32 patterns) + one row. M2: M1 metadata and weights + TG1 of kappa (tests word 3 = 1 and word 6 <= 8) + four rows. A: TG1 of kappa + four rows. Model code bytes for the digest: 'ORS1' || u8 arm code (U 1, O0 2, FR 3, S 4, R 5, M1 6, M2 7, A 8, C_sh 9, C_un 10) || the code bits MSB first, zero padded."

# ---------------------------------------------------------------- arms (selection_count = 10, all enumerated before any collection)
baseline = "B = FR, the incumbent fixed rule (arm 2 when N <= 8 else arm 3): sigma_FR = (rule arm, then the others ascending)."
baseline_sensitivity = "U, O0 (constant score: sigma = (0,1,2,3,4), the oracle-arm frequency), S (best static per core class: arms ascending by total TRAIN ps of that class, ties lower index). Because a qualified improvement must beat FR, U, O0 and S, the effective baseline is whichever of the four has the lowest DL."
candidates = "M1 learned guidance: the ORIG-2 scratch MLP v2 (select.om kind 2, 20-32-1 ReLU, 705 params, seed 19024, lr 2^-8, <= 64 epochs, patience 16, best-on-VALIDATION params), trained on the collected file's TRAIN by run-select.sh V2=1 at aien-train 692d8510 (the ORIG v2 run when D is C2; E runs the same pinned command when D is C3); sigma = ascending slfwd score with the SB params. M2 guidance plus bounded reusable .om abstraction: M1's sigma with one R1 row per kappa context. A abstraction alone: sigma = (0,1,2,3,4) with one row per kappa context."
abstraction_kappa = "kappa(s) = 2 x core class + (1 if N <= 8 else 0), 4 contexts, implemented by native/turing/origsel_kappa.om (tkappa); charged through tg1_code."
controls = "R retrieval (memorizer control, Lemma 2 direction): the nearest TRAIN record of the same core class and pressure by L1 on (lg16 M, lg16 N), lowest index on a tie (oxnear v2); sigma = that record's arms ascending by its ps, ties lower index. C_sh shuffled-label MLP (trainer control 1; its epoch is still chosen on real VALIDATION loss, disclosed) and C_un untrained MLP (declared init), from the same V2=1 run, scored exactly like M1. Controls are diagnostics: they never make the run INVALID."
selection_count = 10

# ---------------------------------------------------------------- blinding
blinding_mechanism = "(1) Temporal: D's collection starts after E is pushed; every arm component is a fixed function of TRAIN and VALIDATION computed by E. (2) Program-enforced non-access audit, rerunnable by anyone holding the collected file: C' = the collected file with, in every admitted HELD-OUT record (both pressures), b = (oxbest + 1) mod 5 and ps of arm a set to 1000000 x (1 + ((a - b) mod 5)); all other words unchanged. C' must reproduce every oxadm2 code and split, else BLOCKED. C' is admitted through a separate allow file whose only line is '<fnv(C')> SYNTHETIC orig-turing-audit'. The pinned V2=1 trainer runs on C'. PASS iff each image equals its twin outside bytes 104..111 and the final 8 bytes (those equal FNV-1a 64 of C' and of the image prefix), every F1 count vector of every arm is identical, and every arm's TPS1 record bytes [128, 128 + 34 n) are identical. FAIL: INVALID. (3) Organisational status: UNISOLATED (one operator fleet collects, trains and evaluates); stated on every receipt."
overlap_audit = "No pretrained data exists in any arm. Workload overlap is handled by burned_exclusion; C2 TRAIN/VALIDATION overlap with D is impossible by the split table and is re-checked by oxdisj."

# ---------------------------------------------------------------- uncertainty and verdict
uncertainty_envelope = "Block bootstrap. Block = one HELD-OUT workload family present in D (both core classes pooled), blocks indexed 0..F-1 by ascending oxcell. 10000 replicates; splitmix64 state 20261025 (wrapping u64: s += 0x9E3779B97F4A7C15, z = s, z = (z ^ (z >> 30)) * 0xBF58476D1CE4E5B9, z = (z ^ (z >> 27)) * 0x94D049BB133111EB, out = z ^ (z >> 31)); replicate i uses outputs iF..iF+F-1, pick = output mod F; the same picks serve every statistic. Replicate statistic (fixed block count, random size) T*(M;Y) = sum over picks of sum over t in the block (ub_Y(t) - ub_M(t)) - 10^6 (L_P1(M) - L_P1(Y)) in micro-bits. Per candidate lb = replicate of rank 167, ub = rank 9834 (ascending; one-sided 0.05/3 each, Bonferroni over M1, M2, A). Bounds condition on the fitted arms and this collection session. Sensitivity: (core, family) blocks, reported only. F < 20 or n < 100: INCONCLUSIVE(UNDERPOWERED) for every candidate."
secondary_endpoint = "Raw held-out log-loss gain dL(X;Y) = L(D|Y,G) - L(D|X,G) with the same picks, for every arm against FR, U, O0, S, and for M1 against C_sh and C_un; reported beside L_P1, L_P2 and the parameter count; never in the Turing verdict except the learning-specific condition below."
verdict_rule = "Checked in this order, first match wins. BLOCKED: the collection is missing, started before E was pushed, refused, or E's qualification receipts are not PASS. INVALID: the non-access audit fails or the independent recomputation disagrees with E on any value. Per candidate M in {M1, M2, A}: QUALIFIED_IMPROVEMENT iff T_ideal(M;FR) > 0 and lb(M;Y) > 0 for every Y in {FR, U, O0, S}, and for M1 and M2 additionally lb of dL(M1;C_sh) and dL(M1;C_un) > 0 (the gain must come from training, not from a calibrated random ranking); NO_IMPROVEMENT iff ub(M;FR) <= 0, labelled NO_IMPROVEMENT(COST_BOUND) when n < n_min(M); else INCONCLUSIVE. Experiment: QUALIFIED_IMPROVEMENT (UNISOLATED) if any candidate qualifies, NO_IMPROVEMENT if every candidate is NO_IMPROVEMENT, else INCONCLUSIVE. T_real wording only where h1_bridge holds."
delta_t = "Delta T(M2 vs M1) = DL(M1) - DL(M2) = T(M2;B) - T(M1;B), independent of B, reported with the same picks; this is the measurement form for comparing two frozen states or learning procedures under one profile. A learning-procedure experiment (two frozen copies, equal budgets, one revising its procedure) needs its own later profile version."
futility_disclosure = "Declared before data. Against U one decision saves at most about 2.32 bits; against a fitted baseline Y at most ub(min Q_Y). n_min(M) = smallest n at which even a perfect predictor beats U = ceil(L_P1(M) x 10^6 / ub(13107)). With about 250 VALIDATION pressure-0 records (about 60 per kappa context): FR about 63 bits; M1 about 22,635 bits, n_min about 9,750; M2 about 22,737 bits, n_min about 9,790 (both beyond the 2048-record file cap: they cannot qualify in this experiment whatever their decisions); A about 145 bits (TG1 21 + four rows of about 31), n_min about 63, so A's verdict depends on the data. Expected n is about 250 (about 21 percent of 1200 fresh coverage shapes in HELD-OUT families) [estimate, not computed from the generators]. A NO_IMPROVEMENT(COST_BOUND) says nothing about decision quality."
verification_requirements = "Qualification receipts in E, before any collection: ub golden values (CODER_SPEC s.8); .om ideal_ub equals turing-coder ideal_ub on every fixture stream; H1 band on K = 5 streams at n 50, 100, 300; refusal of a receipt with a wrong L(X|G), a unit whose hash is not pinned, duplicate or unpaired records (oxadm2 counts), a mutated receipt field; leakage test (C' construction applied to a fixture leaves every TPS1 record byte unchanged); the planted and null fixtures below; the whole pipeline on the v1 owner file (inspected, never D) as a dry run. Planted fixture: a SYNTHETIC omexpfix file; requires exact .om/recomputer agreement and reports T(A;FR). Null fixture: its oracle labels replaced by a seeded state-independent rotation; requires ub(A;O0) <= 0."
independent_recomputation = "A second implementation (C, tools/turing_origsel_indep/, binary32 via IEEE float with -ffp-contract=off, disclosed external referee) starts from the admitted raw records, the images, the v1 files and this profile; it reconstructs orders, labels, F1 rows, model code lengths, ub, totals, bootstrap and the verdict without reading E's per-decision values; every value must agree exactly. turing-coder verify reproduces ideal_ub and gives coded bits per arm."
publication = "Published with the receipt: profile, E, per-arm model code digests and F1 counts, block map, per-decision ub list, TPS1/TSY1 digests. The collected file stays local (owner data); without its release the result is INTERNALLY_REPLAYED."
energy_instrumentation = "none (NOT_MEASURED)"
attribution_rule = "none: no joules attributed; informational conservation: each candidate receives one gain under this profile, never split or re-credited across ORIG issues."
not_measured = "Turing yield and T/J NOT_MEASURED. GB10 NOT_RUN (host-only)."
software_version = "see shared_background and evaluator_freeze; every receipt records E, the omc sha256 and each unit sha256."
separate_measures = "Reported beside T, never inside it: task correctness (verified-arm legality from admission), transfer (R_p1 and D_fresh vs D_v1fam), retention after restart (TPS1 bytes identical after reloading every image in a fresh process), decision-cost regressions, learning cost and per-decision overhead (ORIG-3 v2 judge and overhead campaign, cited by commit, not recomputed)."
